name: Sync TCG Collector to Monarch

on:
  schedule:
    # Runs daily at 06:00 UTC (adjust hour as needed)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync script
        env:
          TCGCOLLECTOR_USER: ${{ secrets.TCGCOLLECTOR_USER }}
          MONARCH_EMAIL: ${{ secrets.MONARCH_EMAIL }}
          MONARCH_PASSWORD: ${{ secrets.MONARCH_PASSWORD }}
          MONARCH_ACCOUNT_ID: ${{ secrets.MONARCH_ACCOUNT_ID }}
        run: |
          python sync_tcg_to_monarch.py
